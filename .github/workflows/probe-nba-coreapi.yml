name: Probe NBA core API (verification)

# nba.com's own front end talks to core-api.nba.com (found in its _app bundle).
# This probe extracts the routes/headers it uses and records the exact HTTP + CORS
# answers a foreign origin receives — the decisive test for whether a browser can
# read official NBA data without a relay, and whether standings are reachable.
# Evidence: data/verification/core-api-probe.json

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_core_api.py'
      - '.github/workflows/probe-nba-coreapi.yml'

permissions:
  contents: write

concurrency:
  group: nba-probe-writes
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/probe_core_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-api-probe-evidence
          path: data/verification/
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verification/core-api-probe.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(verify): core API probe evidence [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs -q origin "${GITHUB_REF_NAME}" && git push && { echo pushed; exit 0; }
            echo "retry ${attempt}"; sleep 5
          done
          exit 1
