name: Probe NBA access paths (verification)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_access.py'
      - '.github/workflows/probe-nba-access.yml'

permissions:
  contents: write

concurrency:
  group: probe-nba-access
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe access paths
        run: python3 scripts/probe_access.py --out data/verification/access-probe.json
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-probe-evidence
          path: data/verification/
          if-no-files-found: warn

      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verification/access-probe.json data/verification/access-probe.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(verify): NBA access probe evidence [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" && git push && { echo "pushed"; exit 0; }
            echo "push attempt ${attempt} failed, retrying"; sleep 5
          done
          echo "could not push evidence (non-fatal for the probe itself)"; exit 1
