name: Probe NBA standings sources (verification)

# Standings are the one section the board leaves out, because every official
# source we tried refused. This probe re-tests the candidates and reads the JS
# that www.nba.com/standings itself loads, looking for the endpoint it calls.
# Evidence lands in data/verification/standings-probe.json.

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_standings.py'
      - '.github/workflows/probe-nba-standings.yml'

permissions:
  contents: write

concurrency:
  group: nba-probe-writes
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/probe_standings.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standings-probe-evidence
          path: data/verification/
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verification/standings-probe.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(verify): standings source probe evidence [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs -q origin "${GITHUB_REF_NAME}" && git push && { echo pushed; exit 0; }
            echo "retry ${attempt}"; sleep 5
          done
          exit 1
