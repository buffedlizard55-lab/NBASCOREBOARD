name: Sync official NBA data

# GitHub's schedule is best-effort, not a real-time service. Publish only NBA-owned
# responses, and preserve the last valid snapshot if an endpoint fails validation.
on:
  schedule:
    - cron: '*/5 * * * *'  # fastest GitHub Actions schedule; may be delayed/skipped
    - cron: '0 6 * * *'    # one full schedule/history pass each UTC day
  workflow_dispatch:
    inputs:
      mode:
        description: 'live = board/details, daily = + recent dates, full = + schedule/backfill, refresh = provenance refresh'
        type: choice
        options: [live, daily, full, refresh]
        default: daily
      game:
        description: 'Optional official 10-digit NBA game ID to re-verify its complete box/PBP'
        required: false
        type: string
  push:
    # Temporary verification run on this PR branch: dispatch API is unavailable to
    # our GitHub integration. Remove this branch before merging to main.
    branches: [main, arena/01a0da68-nbascoreboard]
    paths:
      - 'scripts/sync_nba_data.py'
      - 'scripts/nba_official.py'
      - '.github/workflows/sync-nba-data.yml'

permissions:
  contents: write

concurrency:
  group: nba-data-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide sync mode
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = 'schedule' ]; then
            if [ "$SCHEDULE" = '0 6 * * *' ]; then mode=full; else mode=daily; fi
          elif [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            mode="${DISPATCH_MODE:-daily}"
          else
            if [[ "$COMMIT_MSG" == *'[sync:full]'* ]]; then mode=full
            elif [[ "$COMMIT_MSG" == *'[sync:daily]'* ]]; then mode=daily
            else mode=live; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Fetch, validate and archive official data
        id: ingest
        continue-on-error: true # commit the failure evidence, then fail the job below
        env:
          # One real NBA final/PBP re-fetch for this PR's temporary push audit.
          AUDIT_GAME: ${{ inputs.game || (github.ref_name == 'arena/01a0da68-nbascoreboard' && '0022400154') }}
          SYNC_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          if [ -n "$AUDIT_GAME" ]; then
            python3 scripts/sync_nba_data.py --mode "$SYNC_MODE" --game "$AUDIT_GAME"
          else
            python3 scripts/sync_nba_data.py --mode "$SYNC_MODE"
          fi

      - name: Report the run
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          history = json.load(open('data/verification/sync-log.json'))
          hb = history.get('heartbeat') or {}
          print('### Official NBA sync')
          print(f"Latest published check: {hb.get('lastCheckedUtc', 'unavailable')}")
          print(f"Last successful live read: {hb.get('lastSuccessfulLiveUtc', 'unavailable')}")
          print(f"Status: {hb.get('lastResult', 'unknown')}")
          for issue in hb.get('issues') or []:
              print(f"- IRREGULARITY: {issue}")
          PY

      - name: Commit changed data and error evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo 'No new data or evidence'; exit 0; fi
          git commit -m 'data: official NBA sync (${{ steps.mode.outputs.mode }}) [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}" && exit 0
            echo "retry $attempt"; sleep 5
          done
          echo 'Unable to publish official data / failure evidence' >&2
          exit 1

      - name: Fail visibly when any NBA read or validation failed
        if: steps.ingest.outcome != 'success'
        run: exit 1
