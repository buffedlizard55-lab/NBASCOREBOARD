name: Sync official NBA data

# The scoreboard's always-fresh static fallback.
#
# GitHub Actions runs this on a real network egress, pulls ONLY official NBA
# endpoints (cdn.nba.com / stats.nba.com), and commits the responses next to the
# site so GitHub Pages serves them same-origin. That removes the two blockers a
# purely client-side page cannot beat: stats.nba.com has no CORS headers, and some
# client networks cannot reach cdn.nba.com at all.
#
# Commits happen only when the official content actually changed, which keeps the
# repo and the Pages build budget healthy.

on:
  schedule:
    # Every 10 minutes. Live rows are still fetched straight from cdn.nba.com by the
    # browser; this snapshot exists for the cases where that is impossible.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'live = today only, daily = + standings/recent history, full = + schedule/backfill'
        type: choice
        options: [live, daily, full]
        default: daily
  push:
    paths:
      - 'scripts/sync_nba_data.py'
      - 'scripts/nba_official.py'
      - '.github/workflows/sync-nba-data.yml'

permissions:
  contents: write

concurrency:
  group: sync-nba-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide sync mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Nightly (UTC 06:00 = 02:00 ET) does the heavy full pass; other runs are light.
            if [ "$(date -u +%H%M)" \< "0700" ]; then echo "mode=full" >> "$GITHUB_OUTPUT";
            else echo "mode=daily" >> "$GITHUB_OUTPUT"; fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=live" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync official NBA data
        run: python3 scripts/sync_nba_data.py --mode ${{ steps.mode.outputs.mode }}

      - name: Report what changed
        run: |
          echo "### NBA data sync (${{ steps.mode.outputs.mode }})" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          log = json.load(open('data/verification/sync-log.json'))['runs'][0]
          print(f"\n- run: `{log['runStartedUtc']}` → `{log.get('runFinishedUtc')}`")
          print(f"- steps OK: **{log['summary']['ok']}**, failed: **{log['summary']['failed']}**, files written: **{log['summary']['written']}**\n")
          print("| step | target | result | status | games/teams |")
          print("|---|---|---|---|---|")
          for s in log['steps'][:40]:
              target = s.get('date') or s.get('season') or s.get('candidate') or s.get('step')
              extra = s.get('gameCount') if s.get('gameCount') is not None else s.get('teamCount', '')
              print(f"| {s.get('step')} | `{target}` | {s.get('result')} | {s.get('httpStatus')} | {extra} |")
          PY

      - name: Commit data when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No official data changes — nothing to commit."
            exit 0
          fi
          git commit -m "data: official NBA sync (${{ steps.mode.outputs.mode }}) [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" && git push && { echo "pushed"; exit 0; }
            echo "push attempt ${attempt} failed, retrying"; sleep 5
          done
          echo "could not push data"; exit 1
