name: Verify

# Offline checks are not proof of live NBA access. They check that published files
# have NBA-source provenance, consistent hashes/counts/scores, and a working UI.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and ingestion edge cases
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate EVERY published NBA JSON file and cross-source final scores
        run: python3 tests/verify_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Browser behavior (real page, archived NBA examples and synthetic live game)
        run: |
          npm --prefix tests ci --silent
          npm --prefix tests test
